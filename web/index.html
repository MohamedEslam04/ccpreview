<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccpreview</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="side">
  <div class="side-top">
    <div class="seg" role="tablist">
      <button data-tab="pages" role="tab"><span data-i18n="tab.pages"></span> <span class="count" id="pageCount"></span></button>
      <button data-tab="sessions" role="tab"><span data-i18n="tab.sessions"></span> <span id="liveBadge"></span></button>
    </div>
  </div>

  <div id="pagesPane" class="pane">
    <div class="pane-tools">
      <button id="add" class="btn primary" data-i18n-title="pages.new_tip"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="pages.new"></span></button>
      <button id="searchBtn" class="btn" data-i18n-title="pages.search_tip"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    </div>
    <ol id="thumbs"></ol>
  </div>

  <div id="sessionsPane" class="pane" hidden>
    <div class="pane-tools">
      <label class="field"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="sessFilter" data-i18n-placeholder="sessions.filter_ph" autocomplete="off"></label>
      <button id="groupBy" class="btn"></button>
      <button id="foldAll" class="btn"></button>
    </div>
    <div class="sess-filters" id="sessFilters" role="tablist" data-i18n-aria-label="sessions.filter_aria"></div>
    <div class="date-row">
      <span class="date-sel" data-i18n-title="date.tip">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <select id="dateFilter">
          <option value="any" data-i18n="date.any"></option>
          <option value="today" data-i18n="date.today"></option>
          <option value="yesterday" data-i18n="date.yesterday"></option>
          <optgroup data-i18n-label="date.group">
            <option value="d2" data-i18n="date.d2"></option>
            <option value="d3" data-i18n="date.d3"></option>
            <option value="d4" data-i18n="date.d4"></option>
            <option value="d5" data-i18n="date.d5"></option>
            <option value="d6" data-i18n="date.d6"></option>
            <option value="d7" data-i18n="date.d7"></option>
            <option value="d10" data-i18n="date.d10"></option>
            <option value="d14" data-i18n="date.d14"></option>
            <option value="d30" data-i18n="date.d30"></option>
          </optgroup>
          <option value="custom" data-i18n="date.custom"></option>
        </select>
      </span>
      <span class="date-custom" id="dateCustom" hidden>
        <input type="date" id="dateFrom" data-i18n-title="date.from"><span data-i18n="date.arrow"></span><input type="date" id="dateTo" data-i18n-title="date.to">
      </span>
      <button class="date-clear" id="dateClear" data-i18n-title="date.clear" hidden><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div id="sessList"></div>
  </div>

  <div class="side-foot">
    <button id="srvBtn" class="chip"><span class="dot"></span><span class="lbl"></span><span class="act"></span></button>
    <span id="saveState"></span>
    <button id="exportBtn" class="icon-btn" data-i18n-title="pages.export_tip"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
    <button id="importBtn" class="icon-btn" data-i18n-title="pages.import_tip"><svg viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg></button>
    <button id="usageBtn" class="icon-btn usage-btn" hidden></button>
    <button id="notifyBtn" class="icon-btn"></button>
    <button id="langBtn" class="icon-btn"></button>
    <button id="themeBtn" class="icon-btn"></button>
    <button id="close" class="icon-btn" data-i18n-title="side.hide"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
  </div>
  <div id="resizer" data-i18n-title="side.resize"></div>
</aside>

<main id="main">
  <div id="edWrap" class="scroll">
    <div id="ed" class="page" contenteditable spellcheck="false" data-i18n-data-ph="pages.editor_ph"></div>
  </div>
  <div class="hints" id="hints">
    <span><kbd>Ctrl</kbd><kbd>Enter</kbd> <span data-i18n="hint.new"></span></span>
    <span><kbd>Ctrl</kbd><kbd>K</kbd> <span data-i18n="hint.search"></span></span>
    <span><kbd>Alt</kbd><kbd>↑↓</kbd> <span data-i18n="hint.nav"></span></span>
    <span><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>V</kbd> <span data-i18n="hint.raw"></span></span>
  </div>
  <div id="panes" hidden><div id="tabbar" hidden></div><div id="pgrids"></div></div>
  <div id="vempty" class="scroll vempty" hidden></div>
</main>

<button id="open" class="icon-btn" data-i18n-title="side.show"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
<div id="tblbar" hidden>
  <button class="btn" data-f="md" data-i18n-title="table.md_tip" data-i18n="table.md"></button>
  <button class="btn" data-f="tsv" data-i18n-title="table.tsv_tip" data-i18n="table.tsv"></button>
</div>
<div id="search" hidden>
  <div class="box">
    <div class="qrow"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" data-i18n-placeholder="pages.search_ph" autocomplete="off"><kbd>Esc</kbd></div>
    <ul id="results"></ul>
  </div>
</div>
<div id="toast" hidden></div>
<div class="menu" id="widthMenu" hidden></div>
<div class="menu" id="usageMenu" hidden></div>
<div id="lightbox" hidden>
  <div class="lb-top">
    <span id="lbCount" class="lb-count"></span>
    <span id="lbTitle" class="lb-title"></span>
    <div class="lb-tools">
      <button class="lb-btn" data-lb="out" data-i18n-title="lightbox.out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="lb-btn lb-zoom" data-lb="fit" id="lbZoom" data-i18n-title="lightbox.fit">100%</button>
      <button class="lb-btn" data-lb="in" data-i18n-title="lightbox.in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="lb-btn" data-lb="actual" data-i18n-title="lightbox.actual">1:1</button>
      <span class="lb-sep"></span>
      <button class="lb-btn" data-lb="info" data-i18n-title="lightbox.info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
      <button class="lb-btn" data-lb="copy" data-i18n-title="lightbox.copy"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
      <a class="lb-btn" id="lbDownload" download data-i18n-title="lightbox.download"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></a>
      <a class="lb-btn" id="lbOpen" target="_blank" rel="noopener" data-i18n-title="lightbox.open"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
      <button class="lb-btn" data-lb="close" data-i18n-title="lightbox.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </div>
  <div class="lb-main">
    <div class="lb-stage" id="lbStage"><img id="lbImg" alt="" draggable="false"></div>
    <aside class="lb-info" id="lbInfo" hidden></aside>
  </div>
  <button class="lb-nav lb-prev" data-lb="prev" data-i18n-title="lightbox.prev"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <button class="lb-nav lb-next" data-lb="next" data-i18n-title="lightbox.next"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <div class="lb-strip" id="lbStrip"></div>
  <div class="lb-hint" data-i18n="lightbox.hint"></div>
</div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script src="core.js"></script>
<script src="source.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
